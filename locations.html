<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locations — Bird List J</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .gallery-section { max-width: 900px; margin: 0 auto; padding: 2rem; }

  .results-count {
    font-size: 0.78rem; color: var(--ink-light);
    margin-bottom: 1.5rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  .loc-card {
    cursor: pointer; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--stone);
    transition: box-shadow 0.2s, transform 0.2s;
    background: var(--white);
  }
  .loc-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.08); transform: translateY(-2px); }

  .loc-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .loc-no-photo {
    width: 100%; aspect-ratio: 16/10; background: var(--off-white);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.4rem;
  }
  .loc-no-photo svg { opacity: 0.2; }
  .loc-no-photo-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mist); font-weight: 500; }

  .loc-body { padding: 1rem 1.15rem 1.15rem; }
  .loc-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; color: var(--ink-dark); line-height: 1.25; margin-bottom: 0.15rem; }
  .loc-region { font-size: 0.78rem; color: var(--ink-light); margin-bottom: 0.7rem; }

  .loc-iconic-row { display: flex; gap: 0.4rem; align-items: center; }
  .loc-iconic-thumb {
    width: 32px; height: 32px; border-radius: 50%;
    object-fit: cover; border: 2px solid var(--white);
    box-shadow: 0 0 0 1px var(--stone);
    margin-left: -0.5rem;
  }
  .loc-iconic-thumb:first-child { margin-left: 0; }
  .loc-iconic-more {
    font-size: 0.68rem; color: var(--ink-light); margin-left: 0.5rem;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,23,20,0.65);
    z-index: 200; display: flex;
    align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; overflow-y: auto;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--white); border-radius: 12px;
    max-width: 780px; width: 100%; overflow: hidden;
    transform: translateY(16px); transition: transform 0.25s; margin: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header { position: relative; background: #111; }
  .modal-photo { width: 100%; max-height: 60vh; object-fit: contain; display: block; background: #111; }
  .modal-no-photo {
    width: 100%; aspect-ratio: 16/9; background: var(--off-white);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.6rem;
  }
  .modal-no-photo svg { opacity: 0.2; }
  .modal-no-photo p { font-size: 0.78rem; color: var(--mist); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500; }

  .modal-close {
    position: absolute; top: 0.85rem; right: 0.85rem;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0,0,0,0.4); border: none; color: white;
    font-size: 1rem; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(0,0,0,0.65); }

  .modal-body { padding: 1.75rem 2rem 2rem; }
  .modal-title { font-family: var(--serif); font-size: 1.9rem; font-weight: 400; color: var(--ink-dark); line-height: 1.15; margin-bottom: 0.2rem; }
  .modal-region { font-size: 0.9rem; color: var(--ink-light); margin-bottom: 1.5rem; }
  .modal-desc { font-size: 0.95rem; line-height: 1.75; color: var(--ink-light); margin-bottom: 1.75rem; }

  .modal-iconic-label {
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-light); margin-bottom: 0.85rem;
  }

  .iconic-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .iconic-species-card {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem 0.5rem 0.5rem;
    border: 1px solid var(--stone);
    border-radius: 30px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-decoration: none;
  }
  .iconic-species-card:hover { border-color: var(--accent); background: var(--accent-light); }

  .iconic-species-img {
    width: 34px; height: 34px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
  }
  .iconic-species-noimg {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--off-white);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .iconic-species-noimg svg { width: 18px; height: 18px; opacity: 0.3; }

  .iconic-species-name {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink);
  }

  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--ink-light); }

  @media (max-width: 600px) {
    .gallery-section { padding: 1.5rem 1rem; }
    .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .modal-body { padding: 1.25rem 1.25rem 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <a class="site-logo" href="index.html">Bird List <span>J</span></a>
  <nav>
    <a href="index.html">Species</a>
    <a href="locations.html" class="active">Locations</a>
    <a href="stats.html">Stats</a>
    <a href="about.html">About</a>
  </nav>
</header>

<div class="banner">
  <img class="banner-img" src="photos/greatMarsh.JPG" alt="Banner">
</div>

<section class="page-hero">
  <p class="page-eyebrow">Field Notes</p>
  <h1 class="page-title">The places I've gone <em>looking.</em></h1>
  <p class="page-desc">Parks, trails, and backyards where the search has taken me — and the species that made each one memorable.</p>
  <div class="stats-row" id="hero-stats"></div>
</section>

<section class="gallery-section">
  <p class="results-count" id="results-count"></p>
  <div class="gallery" id="loc-gallery"></div>
  <div class="empty-state" id="empty-state" style="display:none"><p>No locations added yet.</p></div>
</section>

<footer>Bird List J &nbsp;·&nbsp; Updated June 2025</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header" id="modal-header">
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-region" id="modal-region"></p>
      <p class="modal-desc" id="modal-desc"></p>
      <p class="modal-iconic-label" id="modal-iconic-label" style="display:none">Iconic species found here</p>
      <div class="iconic-grid" id="iconic-grid"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="locations-data.js"></script>
<script>
function birdIcon(size=48){return`<svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none"><ellipse cx="24" cy="28" rx="14" ry="10" fill="#c8c4bc"/><circle cx="32" cy="18" r="8" fill="#c8c4bc"/><polygon points="40,18 48,16 40,22" fill="#aaa09a"/><circle cx="34" cy="16" r="1.5" fill="#3a3630"/><path d="M16 32 Q10 38 8 42" stroke="#aaa09a" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M20 36 Q18 42 17 45" stroke="#aaa09a" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`;}

function findBirdByName(name){
  return BIRDS.find(b=>b.commonName.toLowerCase()===name.toLowerCase());
}
function birdThumb(name){
  const b=findBirdByName(name);
  if(b&&b.photos&&b.photos.length) return `photos/${b.photos[0].file}`;
  return null;
}

// Stats
document.getElementById('hero-stats').innerHTML=`
  <div class="stat"><span class="stat-number">${LOCATIONS.length}</span><span class="stat-label">Locations</span></div>
  <div class="stat"><span class="stat-number">${[...new Set(LOCATIONS.flatMap(l=>l.iconicSpecies))].length}</span><span class="stat-label">Featured species</span></div>`;

function render(){
  const grid=document.getElementById('loc-gallery');
  const empty=document.getElementById('empty-state');
  const countEl=document.getElementById('results-count');
  grid.innerHTML='';
  if(LOCATIONS.length===0){empty.style.display='block';countEl.textContent='';return;}
  empty.style.display='none';
  countEl.textContent=`${LOCATIONS.length} location${LOCATIONS.length>1?'s':''}`;

  LOCATIONS.forEach(loc=>{
    const card=document.createElement('div');
    card.className='loc-card';card.setAttribute('role','button');card.setAttribute('tabindex','0');

    const imgHTML=loc.photo
      ? `<img class="loc-img" src="photos/${loc.photo}" alt="${loc.name}" loading="lazy">`
      : `<div class="loc-no-photo">${birdIcon(40)}<span class="loc-no-photo-label">No photo</span></div>`;

    const shownSpecies=loc.iconicSpecies.slice(0,4);
    const extra=loc.iconicSpecies.length-shownSpecies.length;
    const thumbsHTML=shownSpecies.map(name=>{
      const src=birdThumb(name);
      return src
        ? `<img class="loc-iconic-thumb" src="${src}" alt="${name}" title="${name}">`
        : '';
    }).filter(Boolean).join('');
    const moreHTML=extra>0?`<span class="loc-iconic-more">+${extra} more</span>`:'';

    card.innerHTML=`${imgHTML}<div class="loc-body"><p class="loc-name">${loc.name}</p><p class="loc-region">📍 ${loc.region}</p><div class="loc-iconic-row">${thumbsHTML}${moreHTML}</div></div>`;
    card.addEventListener('click',()=>openModal(loc));
    card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openModal(loc);});
    grid.appendChild(card);
  });
}

function openModal(loc){
  const header=document.getElementById('modal-header');
  const closeBtn='<button class="modal-close" id="modal-close">✕</button>';
  if(loc.photo){
    header.innerHTML=`<img class="modal-photo" src="photos/${loc.photo}" alt="${loc.name}">${closeBtn}`;
  } else {
    header.innerHTML=`<div class="modal-no-photo">${birdIcon(60)}<p>No photo on record</p></div>${closeBtn}`;
  }
  document.getElementById('modal-close').addEventListener('click',closeModal);

  document.getElementById('modal-title').textContent=loc.name;
  document.getElementById('modal-region').textContent=`📍 ${loc.region}`;
  document.getElementById('modal-desc').textContent=loc.description;

  const iconicGrid=document.getElementById('iconic-grid');
  const iconicLabel=document.getElementById('modal-iconic-label');
  iconicGrid.innerHTML='';
  if(loc.iconicSpecies && loc.iconicSpecies.length){
    iconicLabel.style.display='block';
    loc.iconicSpecies.forEach(name=>{
      const src=birdThumb(name);
      const bird=findBirdByName(name);
      const a=document.createElement('a');
      a.className='iconic-species-card';
      a.href=bird?`index.html?search=${encodeURIComponent(name)}`:'#';
      a.innerHTML=`${src?`<img class="iconic-species-img" src="${src}" alt="${name}">`:`<div class="iconic-species-noimg">${birdIcon(18)}</div>`}<span class="iconic-species-name">${name}</span>`;
      iconicGrid.appendChild(a);
    });
  } else {
    iconicLabel.style.display='none';
  }

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
</body>
</html>
